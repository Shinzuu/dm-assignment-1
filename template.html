<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="__META__">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>&#9999;</text></svg>">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFBF7; --rule:#BFD0E0; --margin:#A8453F;
    --ink:#15203A; --pencil:#6A7794;
    --ground:#E8E6E0;
    --chrome:#1A1F2B; --chrome-ink:#E7EBF2; --chrome-dim:#9AA5B8;
    --line:#D6D9E0;
    --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ground);color:var(--ink);
       font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:#8C3A35}

  .nav{position:sticky;top:0;z-index:30;background:var(--chrome);color:var(--chrome-ink)}
  .nav .in{max-width:64rem;margin:0 auto;display:flex;align-items:center;gap:.4rem;
           padding:.5rem 1.1rem;flex-wrap:wrap}
  .nav .home{font:600 .86rem/1 var(--sans);color:var(--chrome-ink);text-decoration:none;
             padding:.45rem .6rem;border-radius:5px;margin-right:.3rem}
  .nav .home:hover{background:#262C3A}
  .nav a.tab{font:500 .85rem/1 var(--sans);color:var(--chrome-dim);text-decoration:none;
             padding:.45rem .7rem;border-radius:5px;border:1px solid transparent}
  .nav a.tab:hover{color:var(--chrome-ink);background:#262C3A}
  .nav a.tab[aria-current="page"]{color:#fff;background:#2C3344;border-color:var(--margin)}
  .nav .sp{flex:1}
  .nav .meta{font:500 .74rem/1 var(--mono);color:var(--chrome-dim)}
  .nav button{font:500 .8rem/1 var(--sans);background:#262C3A;color:var(--chrome-ink);
              border:1px solid #39404F;border-radius:5px;padding:.42rem .6rem;cursor:pointer}
  .nav button:hover{border-color:var(--margin)}
  .nav button[aria-pressed="true"]{background:#36405A;border-color:var(--margin)}
  .nav .pct{font:500 .76rem/1 var(--mono);color:var(--chrome-dim);min-width:3.1rem;text-align:center}
  .nav a:focus-visible,.nav button:focus-visible{outline:2px solid #E8A9A4;outline-offset:2px}
  @media (max-width:620px){ .nav .meta{display:none} }

  .head{max-width:64rem;margin:0 auto;padding:2.2rem 1.25rem 1rem}
  .head h1{font:600 clamp(1.45rem,4.2vw,2.1rem)/1.15 var(--serif);margin:0 0 .4rem}
  .head .course{font:500 .8rem/1 var(--mono);color:#6A7080;margin:0 0 1rem}
  .head p{max-width:60ch;margin:.5rem 0;color:#333A48}
  .dates{display:flex;flex-wrap:wrap;gap:0 2.4rem;margin:1.3rem 0 0;padding:.9rem 0 0;
         border-top:1px solid var(--line)}
  .dates div{min-width:13rem}
  .dates dt{font:500 .72rem/1.6 var(--mono);color:#6A7080}
  .dates dd{margin:0;font:600 1.02rem/1.35 var(--sans)}
  .dates dd em{font:400 .8rem/1.35 var(--sans);color:#6A7080;font-style:normal;display:block}

  .pick{max-width:64rem;margin:0 auto;padding:1.4rem 1.25rem 4rem;
        display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1.1rem}
  .pick a{display:block;text-decoration:none;color:var(--ink);background:var(--paper);
          border:1px solid var(--line);border-left:4px solid var(--margin);
          padding:1.3rem 1.4rem 1.5rem;box-shadow:0 1px 2px rgba(0,0,0,.09)}
  .pick a:hover{border-left-color:#7E2F2B;box-shadow:0 3px 14px rgba(0,0,0,.14)}
  .pick h2{font:600 1.2rem/1.25 var(--serif);margin:0 0 .35rem}
  .pick .when{font:500 .74rem/1 var(--mono);color:var(--margin);margin:0 0 .7rem}
  .pick p{margin:.4rem 0 0;font-size:.93rem;color:#444B5A}
  .pick ul{margin:.7rem 0 0;padding-left:1.1rem;font-size:.9rem;color:#4A5160}
  .pick li{margin:.22rem 0}

  .sheets{padding:1rem 0 4rem;overflow-x:auto;overscroll-behavior-x:contain}
  .sheetwrap{display:flex;flex-direction:column;align-items:center;gap:2rem;
             padding:0 1rem;width:max-content;min-width:100%;margin-inline:auto}
  .sheet{
    --pitch:1.4173em; --top:3.4646em; --marg:3.4646em; --right:1.8898em;
    --rule-shift:0.448em;
    position:relative;width:33.07em;height:51.97em;
    font-size:calc(var(--base,clamp(7.4px,2.08vw,22.5px)) * var(--zoom,1));
    background:var(--paper);color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,.18),0 10px 28px rgba(0,0,0,.14);
    overflow:hidden;
  }
  .sheet::before{content:"";position:absolute;left:0;right:0;
    top:calc(var(--top) - var(--rule-shift));height:calc(32 * var(--pitch));
    background:repeating-linear-gradient(to bottom,transparent 0,
      transparent calc(var(--pitch) - 1px),var(--rule) calc(var(--pitch) - 1px),
      var(--rule) var(--pitch));}
  .sheet::after{content:"";position:absolute;top:0;bottom:0;left:var(--marg);
    width:1px;background:var(--margin);opacity:.78}
  .sheet .body{position:absolute;top:var(--top);
    left:calc(var(--marg) + 1.1024em);right:var(--right);font-size:1em}
  .sheet .body > *{margin:0;line-height:var(--pitch);font-size:1em}
  .sheet .blank{height:var(--pitch)}
  .sheet .q,.sheet .h{font-weight:600}
  .sheet .quote{font-family:var(--serif);color:#2B3550}
  .sheet .math{font-family:var(--mono);font-size:.94em}
  .sheet .indent{padding-left:1.6em}
  .sheet .indent2{padding-left:3.2em}
  /* a near-full line is stretched to the margin so the writing fills the
     width the way a hand fills a ruled page; short lines stay ragged */
  .sheet .j{text-align:justify;text-align-last:justify;-moz-text-align-last:justify}

  .sheet table{border-collapse:collapse;width:100%;font-size:.88em;table-layout:auto}
  .sheet table td,.sheet table th{
    height:calc(var(--pitch) - 1px);line-height:calc(var(--pitch) - 1px);
    padding:0 .45em;border:1px solid #9FB3C8;text-align:left;font-weight:400;
    vertical-align:middle;white-space:nowrap;overflow:hidden}
  .sheet table th{font-weight:600;background:#EFF3F7}
  .sheet table td.n,.sheet table th.n{text-align:right;font-family:var(--mono)}

  .sheet svg.dg{display:block;width:100%;height:100%}
  .sheet svg.dg text{font-family:var(--sans);fill:var(--ink)}

  .sheet .folio{position:absolute;right:var(--right);bottom:1.5748em;
    font:500 .86em/1 var(--mono);color:var(--pencil)}
  .sheet .sheetq{position:absolute;left:calc(var(--marg) + 1.1024em);bottom:1.5748em;
    font:500 .86em/1 var(--mono);color:var(--pencil)}

  .guide{max-width:52rem;margin:1.2rem auto 4rem;padding:2.4rem 2.6rem 3rem;
         background:var(--paper);border:1px solid var(--line);
         box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 28px rgba(0,0,0,.1)}
  .guide h3{font:600 1.18rem/1.3 var(--serif);margin:2.4rem 0 .7rem;padding-top:.9rem;
            border-top:1px solid var(--line);scroll-margin-top:4.2rem}
  .guide h3:first-child{border-top:0;padding-top:0;margin-top:0}
  .guide p{margin:.7rem 0;max-width:66ch;color:#2C3444}
  .guide .flag,.guide .warn{padding:.7rem .95rem;border-radius:0 3px 3px 0;margin:1rem 0;max-width:66ch}
  .guide .flag{background:#FBF0EE;border-left:3px solid var(--margin);color:#4A2320}
  .guide .warn{background:#FCF6E3;border-left:3px solid #B58A15;color:#4A3B10}
  .guide .fml{font:500 .95rem/1.7 var(--mono);background:#F1F4F8;color:#1C2740;
              padding:.55rem .85rem;border-radius:3px;margin:.55rem 0;overflow-x:auto}
  .guide .work{margin:1.1rem 0;border:1px solid #CBD5E1;border-radius:3px;overflow:hidden}
  .guide .work figcaption{font:600 .78rem/1 var(--sans);padding:.6rem .9rem;
                          background:#EDF1F6;color:#1C2740;border-bottom:1px solid #CBD5E1}
  .guide .work pre{margin:0;padding:.85rem .9rem;overflow-x:auto;background:#F8FAFC;
                   font:400 .87rem/1.65 var(--mono);color:#1C2740;white-space:pre}
  .guide .tw{overflow-x:auto;margin:1.1rem 0}
  .guide table{border-collapse:collapse;width:100%;font-size:.91rem;min-width:28rem}
  .guide th,.guide td{border:1px solid #CBD5E1;padding:.48rem .66rem;text-align:left;vertical-align:top}
  .guide th{background:#EDF1F6;font-weight:600;color:#1C2740}
  .guide td{color:#2C3444}
  .guide tbody tr:nth-child(even) td{background:#F6F8FB}
  .toc{display:flex;flex-wrap:wrap;gap:.35rem .45rem;margin:1.1rem 0 0}
  .toc a{font:500 .76rem/1 var(--mono);color:#51586A;text-decoration:none;
         border:1px solid var(--line);border-radius:3px;padding:.33rem .48rem;background:var(--paper)}
  .toc a:hover{color:var(--ink);border-color:var(--margin)}
  @media (max-width:620px){ .guide{padding:1.5rem 1.15rem 2rem;margin-inline:.6rem}
                            .guide table{min-width:22rem;font-size:.85rem} }

  footer{max-width:64rem;margin:0 auto;padding:2rem 1.25rem 4rem;
         border-top:1px solid var(--line);color:#6A7080;font-size:.85rem}
  footer p{margin:.35rem 0;max-width:64ch}

  @media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
  @media print{
    body{background:#fff}
    .nav,.head,.pick,footer{display:none!important}
    .sheets{padding:0;overflow:visible}
    .sheetwrap{gap:0;padding:0;width:auto}
    .sheet{font-size:6.35mm;width:210mm;height:330mm;box-shadow:none;
           page-break-after:always;break-after:page}
    .guide{box-shadow:none;border:0;max-width:none;padding:0;margin:0}
    @page{margin:12mm}
  }
</style>
</head>
<body>
__NAV__
__BODY__
<footer>
  <p>Worked from <em>Data Mining: Concepts and Techniques</em>, Han, Pei &amp; Tong, 4th edition (2022). Problem statements are quoted from the book; every numeric answer was computed independently and re-verified, not taken from a solution manual.</p>
  <p>__BUILTLINE__</p>
</footer>
__SCRIPT__
</body>
</html>
